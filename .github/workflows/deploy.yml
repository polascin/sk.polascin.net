---
name: Deploy to sk.polascin.net

# Nasadenie cez FTPS (lftp) na WebSupport. Prešli sme z SSH/rsync na FTP, pretože
# WebSupport odmieta SSH kľúč zo zdrojových IP GitHub runnerov (Permission denied
# publickey), zatiaľ čo FTP beží na inom porte bez tohto obmedzenia.
#
# Deploy job sa preskočí s upozornením, kým nie sú nastavené DEPLOY_FTP_* secrets
# (Settings → Secrets and variables → Actions), takže workflow nezostáva červený
# pred konfiguráciou.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sk-production-deploy
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate deployable sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Lint PHP syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(git ls-files -z -- '*.php')
          echo "All tracked PHP files passed php -l."

  deploy:
    name: Deploy production
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip deploy]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check deploy configuration
        id: cfg
        env:
          DEPLOY_FTP_SERVER: ${{ secrets.DEPLOY_FTP_SERVER }}
          DEPLOY_FTP_USERNAME: ${{ secrets.DEPLOY_FTP_USERNAME }}
          DEPLOY_FTP_PASSWORD: ${{ secrets.DEPLOY_FTP_PASSWORD }}
          DEPLOY_FTP_DIR: ${{ secrets.DEPLOY_FTP_DIR }}
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_FTP_SERVER" || -z "$DEPLOY_FTP_USERNAME" || -z "$DEPLOY_FTP_PASSWORD" || -z "$DEPLOY_FTP_DIR" ]]; then
            echo "::notice::Deploy skipped — configure DEPLOY_FTP_SERVER, DEPLOY_FTP_USERNAME, DEPLOY_FTP_PASSWORD and DEPLOY_FTP_DIR secrets (see DEPLOY.md)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # server: hostname alebo IPv4/IPv6; dir: bezpečná relatívna cesta bez '..'
          [[ "$DEPLOY_FTP_SERVER" =~ ^[A-Za-z0-9.:_-]+$ ]] || { echo "::error::DEPLOY_FTP_SERVER contains unsupported characters."; exit 1; }
          case "$DEPLOY_FTP_DIR" in
            /*|*..*) echo "::error::DEPLOY_FTP_DIR must be a relative path without '..'."; exit 1 ;;
          esac
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Install lftp
        if: steps.cfg.outputs.configured == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp >/dev/null

      - name: Upload via FTPS (lftp mirror)
        if: steps.cfg.outputs.configured == 'true'
        env:
          FTP_SERVER: ${{ secrets.DEPLOY_FTP_SERVER }}
          FTP_USER: ${{ secrets.DEPLOY_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.DEPLOY_FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.DEPLOY_FTP_PORT }}
          FTP_DIR: ${{ secrets.DEPLOY_FTP_DIR }}
        run: |
          set -euo pipefail
          PORT="${FTP_PORT:-21}"
          # Vynútené FTPS (šifrovaný riadiaci aj dátový kanál). Overenie certifikátu
          # je vypnuté, pretože server adresujeme cez pripnutú IP (cert je na hostname).
          # BEZ --delete: serverové súbory mimo repozitára (napr. db.config.php) zostávajú.
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set net:max-retries 2;
            set net:timeout 25;
            set net:persist-retries 2;
            open -u '$FTP_USER','$FTP_PASS' -p $PORT 'ftp://$FTP_SERVER';
            mirror --reverse --continue --no-perms --parallel=2 \
              --exclude-glob .git \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob .githooks/ \
              --exclude-glob .vscode/ \
              --exclude-glob .claude/ \
              --exclude-glob .trunk/ \
              --exclude-glob tools/ \
              --exclude-glob .gitignore \
              --exclude-glob .gitattributes \
              --exclude-glob .deployignore \
              --exclude-glob '*.md' \
              --exclude-glob '*.ps1' \
              --exclude-glob 'phpstan*' \
              --exclude-glob '.php-cs-fixer*' \
              --exclude-glob 'db.config.php' \
              ./ '$FTP_DIR';
            bye
          "
          echo "FTP mirror completed."

      - name: Smoke test
        if: steps.cfg.outputs.configured == 'true'
        run: |
          set -euo pipefail
          for url in "https://sk.polascin.net/" "https://sk.polascin.net/privacy.php" "https://sk.polascin.net/terms.php"; do
            code=$(curl -sL -o /dev/null -w '%{http_code}' "$url")
            echo "$url -> $code"
            [[ "$code" == "200" ]] || { echo "::error::Smoke test failed for $url (HTTP $code)."; exit 1; }
          done
