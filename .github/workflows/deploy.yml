---
name: Deploy to sk.polascin.net

# Na push do `main` beží iba validácia (php -l). Samotné nasadenie sa NEROBÍ
# z GitHub-hostovaných runnerov: WebSupport ich zdrojové IP blokuje firewallom —
# SSH (publickey denied) aj FTP dátový (pasívny) kanál (LIST/STOR max-retries),
# hoci riadiace porty prejdú a z dôveryhodnej IP (lokál) to funguje.
#
# Produkčný deploy preto beží LOKÁLNE cez pre-push hook (`python tools/ftp_deploy.py`,
# pozri DEPLOY.md). Deploy job nižšie ostáva len pre `workflow_dispatch` — použiteľný
# iba zo self-hosted runnera na IP, ktorú WebSupport povoľuje.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sk-production-deploy
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate deployable sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Lint PHP syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(git ls-files -z -- '*.php')
          echo "All tracked PHP files passed php -l."

  deploy:
    name: Deploy production
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check deploy configuration
        id: cfg
        env:
          DEPLOY_FTP_SERVER: ${{ secrets.DEPLOY_FTP_SERVER }}
          DEPLOY_FTP_USERNAME: ${{ secrets.DEPLOY_FTP_USERNAME }}
          DEPLOY_FTP_PASSWORD: ${{ secrets.DEPLOY_FTP_PASSWORD }}
          DEPLOY_FTP_DIR: ${{ secrets.DEPLOY_FTP_DIR }}
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_FTP_SERVER" || -z "$DEPLOY_FTP_USERNAME" || -z "$DEPLOY_FTP_PASSWORD" || -z "$DEPLOY_FTP_DIR" ]]; then
            echo "::notice::Deploy skipped — configure DEPLOY_FTP_SERVER, DEPLOY_FTP_USERNAME, DEPLOY_FTP_PASSWORD and DEPLOY_FTP_DIR secrets (see DEPLOY.md)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # server: hostname alebo IPv4/IPv6; dir: bezpečná relatívna cesta bez '..'
          [[ "$DEPLOY_FTP_SERVER" =~ ^[A-Za-z0-9.:_-]+$ ]] || { echo "::error::DEPLOY_FTP_SERVER contains unsupported characters."; exit 1; }
          case "$DEPLOY_FTP_DIR" in
            /*|*..*) echo "::error::DEPLOY_FTP_DIR must be a relative path without '..'."; exit 1 ;;
          esac
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Install lftp
        if: steps.cfg.outputs.configured == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp >/dev/null

      - name: Deploy via FTPS (lftp)
        if: steps.cfg.outputs.configured == 'true'
        env:
          FTP_SERVER: ${{ secrets.DEPLOY_FTP_SERVER }}
          FTP_USER: ${{ secrets.DEPLOY_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.DEPLOY_FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.DEPLOY_FTP_PORT }}
          FTP_DIR: ${{ secrets.DEPLOY_FTP_DIR }}
        run: |
          set -euo pipefail
          PORT="${FTP_PORT:-21}"
          # Riadiaci kanál je šifrovaný (AUTH TLS → prihlasovacie údaje chránené),
          # dátový kanál je bez TLS (PROT C). Obchádza to chybu OpenSSL 3 v lftp pri
          # opätovnom použití TLS relácie na dátovom kanáli (pure-ftpd inak dátové
          # spojenie zhodí). Nahrávané súbory sú verejné; db.config.php sa nenahráva.
          # Overenie certifikátu je vypnuté — server adresujeme cez pripnutú IP.
          COMMON="
            set ftp:ssl-force true;
            set ftp:ssl-protect-data false;
            set ssl:verify-certificate no;
            set net:max-retries 2;
            set net:timeout 25;
            open -p $PORT 'ftp://$FTP_SERVER';
            user '$FTP_USER' '$FTP_PASS';"
          # 1) Overenie: prihlásenie a že cieľový adresár je web root (index.php).
          OUT=$(lftp -c "$COMMON echo === LIST ===; cls -1 '$FTP_DIR'; bye" 2>&1) || true
          echo "$OUT"
          if echo "$OUT" | grep -qiE '530|login (incorrect|failed)|access failed'; then
            echo "::error::FTP prihlásenie zlyhalo — skontroluj DEPLOY_FTP_USERNAME/PASSWORD."
            exit 1
          fi
          if ! echo "$OUT" | grep -qE '(^|/)index\.php$'; then
            echo "::error::index.php sa nenašiel v DEPLOY_FTP_DIR='$FTP_DIR' — zlý cieľový adresár."
            exit 1
          fi
          echo "target OK: index.php je v $FTP_DIR"
          # 2) Nahranie bez mazania (serverové súbory mimo repozitára zostávajú).
          lftp -c "$COMMON
            set net:persist-retries 2;
            mirror --reverse --continue --no-perms --parallel=2 \
              --exclude-glob .git \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob .githooks/ \
              --exclude-glob .vscode/ \
              --exclude-glob .claude/ \
              --exclude-glob .trunk/ \
              --exclude-glob tools/ \
              --exclude-glob .gitignore \
              --exclude-glob .gitattributes \
              --exclude-glob .deployignore \
              --exclude-glob '*.md' \
              --exclude-glob '*.ps1' \
              --exclude-glob 'phpstan*' \
              --exclude-glob '.php-cs-fixer*' \
              --exclude-glob 'db.config.php' \
              ./ '$FTP_DIR';
            bye
          "
          echo "FTP deploy done."

      - name: Smoke test
        if: steps.cfg.outputs.configured == 'true'
        run: |
          set -euo pipefail
          for url in "https://sk.polascin.net/" "https://sk.polascin.net/privacy.php" "https://sk.polascin.net/terms.php"; do
            code=$(curl -sL -o /dev/null -w '%{http_code}' "$url")
            echo "$url -> $code"
            [[ "$code" == "200" ]] || { echo "::error::Smoke test failed for $url (HTTP $code)."; exit 1; }
          done
